# Default pipeline configuration.
# Override the pixel size only if the .mrc header is missing/incorrect.
pixel_size_a: null          # Angstrom/pixel; null => read from MRC header

detect:
  method: classical         # classical | unet
  invert: true              # fibrils are darker than background
  sigmas: [1.0, 2.0, 3.0, 4.0]
  prob_threshold: 0.2
  unet_weights: null

trace:
  resample_step: 1.0        # pixels
  smooth_window: 5          # odd number of points
  min_branch_px: 20         # drop shorter free-ended branches; the value every measurement used
  link_crossings: true
  max_link_angle_deg: 60.0  # max turn when pairing branches at a junction
  merge_junction_px: 15.0   # collapse the two Y-nodes of an X into one
  bridge_gap_px: 80.0       # join fragments across a break in the mask (0 = off)
  bridge_angle_deg: 30.0    # collinearity required to bridge a gap
  min_bridge_evidence: 0.25 # detector support required along the bridge

bootstrap_ci: false         # image-level bootstrap for per-patient CIs
