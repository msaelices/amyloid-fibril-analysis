[project]
name = "amyloid-fibril-analysis"
version = "0.1.0"
description = "Automatic tracing and morphological analysis of amyloid fibrils in cryo-EM (.mrc) micrographs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Manuel" }]
keywords = ["cryo-em", "amyloid", "fibril", "segmentation", "morphology", "mrc"]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-image>=0.22",
    "skan>=0.11",
    "mrcfile>=1.5",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "typer>=0.12",
    "roifile>=2024.1.10",   # read ImageJ .roi / RoiSet.zip
    "tifffile>=2024.1.0",
    "pillow>=10.0",         # used directly by afa.segment.dataset
]

[project.optional-dependencies]
# Learned segmentation (U-Net). Kept optional so the deterministic pipeline
# installs with zero heavy ML deps.
#
# torch alone: the U-Net is implemented directly (afa.segment.torch_unet) rather
# than via segmentation-models-pytorch, and augmentation is flips/rotations in
# NumPy rather than albumentations. With a few dozen grayscale training images
# whose texture statistics are nothing like ImageNet's, a pretrained backbone
# buys little and costs a timm + torchvision dependency chain.
dl = [
    "torch>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
afa = "afa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afa"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer relies on function calls (Option/Argument) in argument defaults.
"src/afa/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
